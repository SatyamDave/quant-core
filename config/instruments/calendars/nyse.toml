# NYSE market holidays and early-closing days for 2026 and 2027 (issue #66
# follow-up, wave3/calendar). Referenced from an instrument's
# `trading_hours.calendar` (see config/instruments/spy.toml).
#
# Source: NYSE's official trading-hours calendar,
# https://www.nyse.com/markets/hours-calendars -- accessed 2026-09-28.
# 2026 full-closure dates cross-checked against a second independent source
# (Nasdaq Trader's trading calendar, https://www.nasdaqtrader.com/Trader.aspx?id=Calendar,
# accessed 2026-09-28), and every date's weekday, plus the "observed"
# substitutions (Independence Day and Juneteenth move to the preceding Friday
# when the actual date is a Saturday, and to the following Monday when it is
# a Sunday; Christmas moves to the preceding Friday when Dec 25 is a
# Saturday), verified independently against the Gregorian calendar and the
# Anonymous Gregorian algorithm for Easter/Good Friday.
#
# Coverage is exactly the years present below (2026-2027): there is
# deliberately no entry, and so no coverage, for any other year.
# `instrument.rs`'s `MarketCalendar` fails a date outside that range closed
# (rejects "outside_trading_hours") rather than assuming a regular session --
# see the "date outside coverage" tests in tests/instrument.rs.
#
# A date not listed here but inside 2026-2027 is a regular trading day; the
# weekday/open/close gate in `trading_hours` still applies on top of this file.

