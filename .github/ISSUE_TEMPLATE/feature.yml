name: Feature request
description: Suggest an improvement to the engine, agent service, UI, MCP tools, research stack or docs.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Does this touch the risk gate, kill switch, limits, replay determinism, credentials, or a protected zone? Features that weaken any of these will not be accepted.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
