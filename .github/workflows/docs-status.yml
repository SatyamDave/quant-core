# Regenerates docs/STATUS.md and the live-status block of the project guide
# from repository state, then commits the result to main if anything changed.
#
# Every merge to main regenerates immediately (push). PR opened/closed events are
# picked up by the 30-minute schedule: pull_request_target would give PR events a
# write token and is deliberately not used. PR titles are escaped by
# scripts/docs/gen_status.py. Pushes made with GITHUB_TOKEN trigger no workflows,
# so this cannot loop.
name: docs-status

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-status
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 20
          persist-credentials: false
      - name: Fetch PR list and latest CI run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list --repo "$REPO" --state all --limit 100 \
            --json number,title,state,isDraft,mergedAt,author > "$RUNNER_TEMP/prs.json"
          gh run list --repo "$REPO" --branch main --workflow ci --limit 1 \
            --json conclusion,status,headSha > "$RUNNER_TEMP/ci.json"
      - name: Regenerate
        run: python3 scripts/docs/gen_status.py --prs "$RUNNER_TEMP/prs.json" --ci "$RUNNER_TEMP/ci.json"
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- docs/STATUS.md docs/guide/quant-core-guide.html; then
            echo "status unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STATUS.md docs/guide/quant-core-guide.html
          git commit -m "docs(status): regenerate live status from $(git rev-parse --short HEAD) [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main
