# Weekly OpenSSF Scorecard. On a private repo without GitHub Code Security the
# action can neither publish results nor upload SARIF, so the JSON report is
# kept as a workflow artifact. Switch to SARIF upload once the repo has code
# scanning (see docs/runbooks/github-hardening.md).
name: scorecard

on:
  schedule:
    - cron: "41 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Reads the upstream README recommends for private repositories.
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.json
          results_format: json
          publish_results: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.json
          retention-days: 30
