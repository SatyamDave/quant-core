# Fails a PR labeled `knowledge` that touches anything but markdown, skills or
# rules, breaks a CLAUDE.md line budget, or adds a malformed Learned entry
# (spec section 8.2). The checker is read from the base commit so the PR under
# test cannot change its own check.
name: knowledge-scope-check

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened]

permissions: {}

jobs:
  scope-check:
    if: contains(github.event.pull_request.labels.*.name, 'knowledge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE_SHA:scripts/knowledge/scope_check.py" >"$RUNNER_TEMP/scope_check.py"
          git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" | python3 "$RUNNER_TEMP/scope_check.py"
